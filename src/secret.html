<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration Secrète</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }
        h2 {
            color: #ff4655;
        }
        select {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background: #2a2a4a;
            color: white;
            border: 1px solid #ff4655;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #ff4655;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        button.secondary {
            background: #2a2a4a;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
        }
        .enabled {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #0f0;
        }
        .disabled {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #f00;
        }
    </style>
</head>
<body>
    <h2>🎯 Configuration Secrète</h2>
    <p>Sélectionnez l'agent garanti à 100% :</p>
    
    <select id="agentSelect"></select>
    
    <div>
        <button id="enableBtn">✅ Activer le mode secret</button>
        <button id="disableBtn" class="secondary">❌ Désactiver</button>
    </div>
    
    <div id="status" class="status disabled">
        Mode secret : DÉSACTIVÉ
    </div>
    
    <p style="margin-top: 20px; font-size: 12px; color: #888;">
        Astuce : Ctrl+Shift+A ouvre cette fenêtre
    </p>

    <script src="secret.js"></script>
</body>
</html>
