<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Roulette</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🎯 Valoroulette</h1>
            <details id="appMenu" class="app-menu">
                <summary aria-label="Ouvrir le menu">☰ <span>Menu</span></summary>
                <div class="menu-panel">
                    <section class="update-section">
                        <h2>Mise à jour</h2>
                        <button id="updateBtn" class="btn-secondary">↻ Vérifier les mises à jour</button>
                        <progress id="updateProgress" max="100" value="0" hidden></progress>
                        <p id="updateStatus" class="update-status" aria-live="polite">
                            Vérifiez si une nouvelle version est disponible.
                        </p>
                    </section>
                    <button id="secretModeToggle" class="secret-toggle" title="Mode Secret" aria-pressed="false">
                        🔒 Activer le mode secret
                    </button>
                    <div id="secretTargetControls" class="secret-target-controls" hidden>
                        <label class="secret-target-label" for="secretTargetSelect">Agent cible</label>
                        <select id="secretTargetSelect" class="secret-target-select"></select>
                    </div>
                    <p id="secretModeStatus" class="secret-mode-status" aria-live="polite"></p>
                    <section class="add-agent-section">
                        <h2>➕ Ajouter un agent personnalisé</h2>
                        <div class="add-agent-form">
                            <input type="text" id="agentNameInput" placeholder="Nom de l'agent" />
                            <button id="selectImageBtn" class="btn-secondary">📁 Choisir une image (PNG)</button>
                            <button id="addAgentBtn" class="btn-primary">✅ Ajouter</button>
                            <span id="selectedImagePath" class="image-path"></span>
                        </div>
                        <div id="customAgentsList" class="custom-agents-list"></div>
                    </section>
                </div>
            </details>
        </header>

        <!-- Contenu principal -->
        <div class="main-content">
            <!-- Zone de la roulette -->
            <div class="wheel-section">
                <div class="wheel-container">
                    <canvas id="wheelCanvas" width="500" height="500"></canvas>
                </div>
                
                <div class="wheel-controls">
                    <button id="spinBtn" class="btn-primary">🎲 LANCER LA ROUE</button>
                    <button id="excludeBtn" class="btn-secondary" disabled>🚫 EXCLURE</button>
                </div>
            </div>

            <!-- Panneau latéral : Agents exclus -->
            <div class="excluded-section">
                <h2>Agents Exclus</h2>
                <div id="excludedList" class="excluded-list"></div>
                <button id="resetExcludedBtn" class="btn-reset">🔄 Tout réintégrer</button>
            </div>
        </div>

    </div>

    <script src="renderer.js"></script>
</body>
</html>
